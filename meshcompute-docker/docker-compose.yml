version: '3.8'
services:
  redis:
    image: redis:alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --bind 0.0.0.0 --protected-mode no

  server:
    build: .
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      - AUTH_TOKEN=${AUTH_TOKEN}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
